# Ensan Project Apache Configuration
# Using XAMPP built-in PHP module (php_module) to avoid Windows Defender blocking php-cgi.exe

Alias /ensan/ "F:/Projects/Ensan/System.Ensan-main/public/"
Alias /ensan "F:/Projects/Ensan/System.Ensan-main/public/"
<Directory "F:/Projects/Ensan/System.Ensan-main/public/">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    AddDefaultCharset UTF-8
    <IfModule headers_module>
        Header set Content-Type "text/html; charset=utf-8"
        Header set X-Content-Type-Options "nosniff"
    </IfModule>
</Directory>
